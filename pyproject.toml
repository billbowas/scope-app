[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scope"
version = "0.1.0"
description = "Workload and runway analyzer for academics"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg[binary]>=3.0",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
    "supabase>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[tool.setuptools]
packages = ["scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
