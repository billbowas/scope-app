{% extends "base.html" %}

{% block title %}Create Term — Scope{% endblock %}

{% block content %}
<div style="height: 100%; overflow: auto; background: var(--canvas); padding: var(--space-11) var(--gutter-page);">
    <div style="max-width: var(--measure-form); margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-7);">
        <div style="padding: var(--space-4); background: var(--info-background); border: 1px solid var(--info-border); border-radius: var(--radius-sm); text-align: center;">
            <div style="font-family: var(--font-meta); font-size: var(--size-small); color: var(--text-primary);">Step 1 of 3</div>
        </div>

        <div>
            <h1 style="font-size: var(--size-title);">What term are you starting?</h1>
            <p style="margin-top: var(--space-4); font-family: var(--font-meta); font-size: var(--size-small); color: var(--text-muted);">Term dates are how Scope figures out "this week" and "next week." You can edit them later.</p>
        </div>

        <form method="post" style="display: flex; flex-direction: column; gap: var(--space-5);">
            <div>
                <label for="term_name" style="display: block; margin-bottom: var(--space-3); font-family: var(--font-meta); font-size: var(--size-small); font-weight: var(--weight-semibold); color: var(--text-primary);">Term name</label>
                <input type="text" id="term_name" name="term_name" placeholder="Fall 2026" required style="width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-card); border-radius: var(--radius-sm); font-family: var(--font-meta); font-size: var(--size-body); color: var(--text-primary); background: var(--surface-field);">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5);">
                <div>
                    <label for="start_date" style="display: block; margin-bottom: var(--space-3); font-family: var(--font-meta); font-size: var(--size-small); font-weight: var(--weight-semibold); color: var(--text-primary);">Start date</label>
                    <input type="text" id="start_date" name="start_date" placeholder="Aug 25, 2026" style="width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-card); border-radius: var(--radius-sm); font-family: var(--font-meta); font-size: var(--size-body); color: var(--text-primary); background: var(--surface-field);">
                </div>
                <div>
                    <label for="end_date" style="display: block; margin-bottom: var(--space-3); font-family: var(--font-meta); font-size: var(--size-small); font-weight: var(--weight-semibold); color: var(--text-primary);">End date</label>
                    <input type="text" id="end_date" name="end_date" placeholder="Dec 12, 2026" style="width: 100%; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-card); border-radius: var(--radius-sm); font-family: var(--font-meta); font-size: var(--size-body); color: var(--text-primary); background: var(--surface-field);">
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; padding-top: var(--space-3);">
                <button type="submit" style="padding: 12px 24px; background: var(--action-primary); color: var(--surface-field); border: none; border-radius: var(--radius-sm); font-family: var(--font-meta); font-size: 14px; font-weight: 500; cursor: pointer;">Continue</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
