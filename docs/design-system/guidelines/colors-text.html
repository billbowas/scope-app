<!-- @dsCard group="Colors" viewport="700x160" name="Text on dark" subtitle="Four-step text ladder plus line colours" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;font-family:var(--font-meta)}.g{display:flex;gap:8px;flex-wrap:wrap}.sw{flex:1;min-width:0}.chip{height:52px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.08)}.n{margin-top:6px;font-size:10px;color:var(--text-muted);font-family:var(--font-data)}.v{font-size:10px;color:var(--text-faint);font-family:var(--font-data)}</style></head><body><div style="display:flex;flex-direction:column;gap:8px">
<div style="font-family:var(--font-ui);font-size:20px;color:var(--text-primary)">--text-primary · headings, titles, hero <span class="v">#e8e4da</span></div>
<div style="font-family:var(--font-ui);font-size:16px;color:var(--text-body)">--text-body · sentences and rows <span class="v">#d0d0d0</span></div>
<div style="font-size:13px;color:var(--text-muted)">--text-muted · meta lines, labels <span class="v">#909090</span></div>
<div style="font-size:12px;color:var(--text-faint)">--text-faint · axis ticks, disabled <span class="v">#666</span></div>
<div style="display:flex;gap:8px;margin-top:4px">
<span style="flex:1;height:26px;border:1px solid var(--line-strong)"></span><span style="flex:1;height:26px;border:1px solid var(--line)"></span><span style="flex:1;height:26px;border:1px dashed var(--line-dashed)"></span></div>
<div class="n">--line-strong #3a3a3a · --line #262626 · --line-dashed #5a5a5a (inputs, drop zone)</div>
</div></body></html>
