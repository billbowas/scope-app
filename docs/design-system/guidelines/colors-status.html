<div class="sw"><div class="chip" style="background:var(--warn)"></div><div class="n">--warn</div><div class="v">needs review</div></div><div class="sw"><div class="chip" style="background:var(--warn-bg)"></div><div class="n">--warn-bg</div><div class="v">band fill</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="n">--danger</div><div class="v">discard / remove</div></div><div class="sw"><div class="chip" style="background:var(--danger-bg)"></div><div class="n">--danger-bg</div><div class="v"></div></div><div class="sw"><div class="chip" style="background:var(--ok)"></div><div class="n">--ok</div><div class="v">complete</div></div><div class="sw"><div class="chip" style="background:var(--ok-bg)"></div><div class="n">--ok-bg</div><div class="v"></div></div>
</div></body></html>
